<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Muebles - Admin</title>
    <!-- Google Fonts: Roboto & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/styles.css">
    <style>
        /* Estilos movidos a styles.css para mejor consistencia */
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Header Admin -->
        <header class="admin-header">
            <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: center; gap: var(--spacing-lg);">
                    <div class="logo" style="color: var(--color-accent); font-family: var(--font-family-base); font-size: 1.2rem;">Panel Admin</div>
                    <nav class="admin-nav">
                        <a href="dashboard.html">Resumen</a>
                        <a href="muebles.html" class="active">Muebles</a>
                        <a href="clientes.html">Clientes</a>
                        <a href="pedidos.html">Pedidos</a>
                        <a href="reportes.html">Reportes</a>
                    </nav>
                </div>
                <div class="header-actions">
                    <a href="../../index.html" style="font-size: 0.9rem; margin-right: 15px; color: var(--text-secondary);">← Tienda</a>
                    <span id="user-email" style="margin-right: 15px; font-weight: 500; font-size: 0.9rem;"></span>
                    <button id="btn-logout" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">Cerrar Sesión</button>
                </div>
            </div>
        </header>

        <!-- Contenido Principal -->
        <main class="app-main container" style="max-width: 1200px;">
            <div class="admin-card" style="margin-bottom: var(--spacing-xl);">
                <h2 style="margin-bottom: var(--spacing-md);">Registrar Nuevo Mueble</h2>
                <form id="form-mueble">
                    <input type="hidden" id="mueble-id">
                    <div id="msg-box" style="margin-bottom: var(--spacing-sm); display: none; padding: var(--spacing-sm); border-radius: var(--border-radius-sm);"></div>
                    
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Referencia *</label>
                            <input type="text" id="referencia" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Nombre del Mueble *</label>
                            <input type="text" id="nombre" class="form-control" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="descripcion" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="grid-3">
                        <div class="form-group">
                            <label>Tipo *</label>
                            <select id="tipo" class="form-control" required>
                                <option value="Interior">Interior</option>
                                <option value="Exterior">Exterior</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Categoría *</label>
                            <select id="categoria" class="form-control" required>
                                <option value="Silla">Silla</option>
                                <option value="Mesa">Mesa</option>
                                <option value="Sofá">Sofá</option>
                                <option value="Cama">Cama</option>
                                <option value="Armario">Armario</option>
                                <option value="Escritorio">Escritorio</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Material</label>
                            <input type="text" id="material" class="form-control">
                        </div>
                        <div class="form-group">
                            <label>Color</label>
                            <input type="text" id="color" class="form-control">
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="form-group">
                            <label>Alto (cm) *</label>
                            <input type="number" step="0.01" id="alto_cm" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Ancho (cm) *</label>
                            <input type="number" step="0.01" id="ancho_cm" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Profundidad (cm) *</label>
                            <input type="number" step="0.01" id="profundidad" class="form-control" required>
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="form-group">
                            <label>Peso (gramos) *</label>
                            <input type="number" id="peso" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Precio de Venta ($) *</label>
                            <input type="number" step="0.01" id="precio_venta" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label>Stock Inicial *</label>
                            <input type="number" id="stock" class="form-control" required min="0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Imagen del Mueble (URL externa o Subir Archivo)</label>
                        <div style="display: flex; gap: var(--spacing-sm); align-items: center; margin-bottom: 5px;">
                            <input type="url" id="foto_url" class="form-control" placeholder="URL existente (https://...)" style="flex: 1;">
                            <span style="font-weight: bold; color: var(--text-secondary);">O</span>
                            <input type="file" id="foto_file" class="form-control" accept="image/*" style="flex: 1;">
                        </div>
                        <small id="upload-status" style="color: var(--color-primary); font-weight: 500; display: none;">Subiendo imagen a Cloudinary, por favor espera...</small>
                    </div>

                    <div style="display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-md);">
                        <button type="submit" class="btn btn-primary" id="btn-save">Guardar Producto</button>
                        <button type="button" class="btn btn-secondary" id="btn-cancel" style="display:none;">Cancelar Edición</button>
                    </div>
                </form>
            </div>

            <div class="admin-card">
                <h2 style="margin-bottom: var(--spacing-md);">Inventario de Muebles</h2>
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Imagen</th>
                                <th>Ref</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-muebles">
                            <tr><td colspan="8">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../../js/admin/muebles.js"></script>
</body>
</html>
