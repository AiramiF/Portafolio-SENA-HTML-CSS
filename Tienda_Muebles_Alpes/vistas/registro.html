<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Muebles los Alpes</title>
    <!-- Google Fonts: Roboto & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md); }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
    </style>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: var(--bg-main); padding: var(--spacing-xl) 0;">
    
    <div class="card" style="width: 100%; max-width: 700px; padding: var(--spacing-xl);">
        <div style="text-align: center; margin-bottom: var(--spacing-lg);">
            <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: var(--spacing-xs);">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <h1 class="logo" style="margin-bottom: 0;">Muebles los Alpes</h1>
            </div>
            <p style="color: var(--text-secondary);">Crea tu cuenta de Cliente</p>
        </div>

        <form id="form-registro">
            <div id="error-message" style="color: var(--color-error); font-size: var(--font-size-small); margin-bottom: var(--spacing-sm); display: none;"></div>
            <div id="success-message" style="color: var(--color-success); font-size: var(--font-size-small); margin-bottom: var(--spacing-sm); display: none;"></div>
            
            <h3 style="font-size: var(--font-size-h6); margin-bottom: var(--spacing-sm); border-bottom: 1px solid #e5e7eb; padding-bottom: 4px;">Datos de Acceso</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="email">Correo Electrónico *</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña *</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="6">
                </div>
            </div>

            <h3 style="font-size: var(--font-size-h6); margin-top: var(--spacing-md); margin-bottom: var(--spacing-sm); border-bottom: 1px solid #e5e7eb; padding-bottom: 4px;">Datos Personales</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="tipo_documento">Tipo Documento *</label>
                    <select id="tipo_documento" name="tipo_documento" class="form-control" required>
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="CE">Cédula de Extranjería</option>
                        <option value="NIT">NIT</option>
                        <option value="Pasaporte">Pasaporte</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="num_documento">Número Documento *</label>
                    <input type="text" id="num_documento" name="num_documento" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="tipo_persona">Tipo de Persona</label>
                    <select id="tipo_persona" name="tipo_persona" class="form-control">
                        <option value="Natural">Natural</option>
                        <option value="Juridica">Jurídica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="nombres">Nombres Completos / Razón Social *</label>
                    <input type="text" id="nombres" name="nombres" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="telefono_fijo">Teléfono Fijo *</label>
                    <input type="text" id="telefono_fijo" name="telefono_fijo" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="telefono_movil">Teléfono Móvil</label>
                    <input type="text" id="telefono_movil" name="telefono_movil" class="form-control">
                </div>
            </div>

            <h3 style="font-size: var(--font-size-h6); margin-top: var(--spacing-md); margin-bottom: var(--spacing-sm); border-bottom: 1px solid #e5e7eb; padding-bottom: 4px;">Ubicación</h3>
            <div class="grid-2">
                <div class="form-group">
                    <label for="direccion">Dirección *</label>
                    <input type="text" id="direccion" name="direccion" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="ciudad">Ciudad *</label>
                    <input type="text" id="ciudad" name="ciudad" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="departamento">Departamento *</label>
                    <input type="text" id="departamento" name="departamento" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="pais">País *</label>
                    <input type="text" id="pais" name="pais" class="form-control" required value="Colombia">
                </div>
            </div>
            
            <div class="form-group">
                <label for="profesion">Profesión</label>
                <input type="text" id="profesion" name="profesion" class="form-control">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--spacing-md);" id="btn-submit">
                Crear Cuenta
            </button>
        </form>

        <div style="text-align: center; margin-top: var(--spacing-lg); font-size: var(--font-size-small);">
            ¿Ya tienes cuenta? <a href="login.html">Inicia Sesión aquí</a><br>
            <a href="../index.html" style="color: var(--text-secondary); display: inline-block; margin-top: var(--spacing-sm);">← Volver al inicio</a>
        </div>
    </div>

    <script type="module">
        import { registerUser } from '../js/auth.js';

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errorMsg = document.getElementById('error-message');
            const successMsg = document.getElementById('success-message');
            
            btn.disabled = true;
            btn.textContent = 'Procesando...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            // Recopilar datos del formulario
            const formData = new FormData(e.target);
            const clientData = Object.fromEntries(formData.entries());
            const email = clientData.email;
            const password = clientData.password;
            
            // Remover email y password de clientData ya que van a Auth
            delete clientData.email;
            delete clientData.password;

            const { data, error } = await registerUser(email, password, clientData);

            if (error) {
                errorMsg.textContent = error.message;
                errorMsg.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Crear Cuenta';
            } else {
                successMsg.textContent = 'Cuenta creada exitosamente. Redirigiendo...';
                successMsg.style.display = 'block';
                // [RF-04] Cuenta creada.
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 2000);
            }
        });
    </script>
</body>
</html>
